name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI-Pass
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass placeholder CI gate
        run: echo "CI gate passed."