name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI-Pass
    needs: []
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required CI jobs succeeded
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.discover.result }}" \
            "${{ needs.java-ci.result }}" \
            "${{ needs.blackbox-ci.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CI failed: job result=${result}"
              exit 1
            fi
          done
          echo "All CI checks passed."
